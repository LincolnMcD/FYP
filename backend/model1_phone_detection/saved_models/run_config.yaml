seed: 42
device: auto
image_size: 640
batch_size: 8
epochs: 100
learning_rate: 0.0003
weight_decay: 0.0005
workers: 0
early_stopping_patience: 15
dataset:
  root: C:\Users\User\Desktop\model1_phone_detection\dataset
  train_path: null
  val_path: null
  test_path: null
  max_phone_images: 1000
  max_non_phone_images: 1000
  train_fraction: 0.7
  val_fraction: 0.15
  test_fraction: 0.15
model:
  num_classes: 1
  width: 0.5
  depth: 0.5
  strides:
  - 8
  - 16
  - 32
loss:
  classification_mode: bce
  classification_target: binary
  hard_negative_ratio: 3
  negative_mining: per_image
  classification_weight: 1.0
  box_weight: 5.0
  assign_topk: 5
  focal_alpha: 0.25
  focal_gamma: 2.0
  negative_weight: 1.0
  assignment_alpha: 0.5
  assignment_beta: 6.0
inference:
  confidence_threshold: 0.4
  minimum_precision: 0.7
  iou_threshold: 0.35
  max_detections: 1
evaluation:
  max_detections: 100
augmentation:
  enabled: true
  horizontal_flip: 0.5
  rotation_degrees: 10
  scale_range:
  - 0.9
  - 1.1
  translation: 0.05
  perspective: 0.0003
  brightness: 0.15
  exposure: 0.15
  hsv_hue: 0.015
  hsv_saturation: 0.25
  hsv_value: 0.2
  blur_probability: 0.1
optimizer:
  warmup_epochs: 5
  warmup_start_factor: 0.1
  gradient_clip_norm: 10.0
  scheduler: cosine
  min_learning_rate: 1.0e-05
save_dir: C:\Users\User\Desktop\model1_phone_detection\saved_models
