<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - ReByte</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="adminHeader.css">
  <link rel="stylesheet" href="../adminSidebar.css">
  <style>
    :root {
      --primary-navy: #1e3a8a;
      --primary-blue: #2563eb;
      --bg-page: #f4f6fa;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body.dashboard-page { display: flex; height: 100dvh; background-color: var(--bg-page); color: var(--text-main); overflow: hidden; font-family: Inter, Arial, sans-serif; }
    
    /* Sidebar */
    .sidebar {
      width: 260px; background-color: #fff; border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; padding: 0; flex-shrink: 0;
    }
    .brand {
      height: 105px; flex: 0 0 105px; display: flex; align-items: center; gap: 10px; padding: 0 28px; margin: 0;
      border-bottom: 1px solid #edf0f4;
    }
    .brand img { width: 38px; height: 38px; object-fit: contain; }
    .brand span { font-size: 25px; font-weight: 700; color: #10264b; letter-spacing: -1px; }
    
    .nav-list { list-style: none; display: grid; align-content: start; gap: 8px; padding: 22px 16px; margin: 0; flex: 1; overflow-y: auto; }
    .nav-item {
      min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 9px;
      color: #586579; font-weight: 500; cursor: pointer; text-decoration: none; font-size: 14px;
    }
    .nav-item:hover { background-color: #f1f4f9; }
    .nav-item.active { background-color: #082f72; color: #fff; font-weight: 600; }
    .nav-item svg { width: 20px; height: 20px; flex: 0 0 auto; }
    
    /* Main Content */
    .main-content { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Header */
    .header {
      min-height: 105px; flex: 0 0 105px; display: flex; justify-content: space-between; align-items: center; padding: 0 40px;
      background-color: #fff; border-bottom: 1px solid #e2e6ee; position: sticky; top: 0; z-index: 5;
    }
    .header-title { font-size: 20px; font-weight: 700; color: #173a75; }
    
    .header-right { display: flex; align-items: center; gap: 28px; position: relative; }
    .header-date { font-size: 14px; color: #7a8496; }
    .profile-btn {
      width: 50px; height: 50px; border-radius: 50%; background-color: #f0f1f4; border: none;
      display: flex; align-items: center; justify-content: center; color: #828a98; cursor: pointer;
    }
    .profile-dropdown {
      position: absolute; top: 50px; right: 0; background: #fff; border: 1px solid var(--border-color);
      border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 160px; display: none; z-index: 10;
    }
    .profile-dropdown.show { display: block; }
    .dropdown-item {
      padding: 12px 16px; display: block; text-decoration: none; color: var(--text-main);
      font-size: 14px; font-weight: 500; cursor: pointer; border: none; background: none; width: 100%; text-align: left;
    }
    .dropdown-item:hover { background-color: #f1f5f9; }
    
    /* Content Area */
    .content-area { flex: 1; min-height: 0; width: 100%; padding: clamp(12px, 2.5dvh, 28px) clamp(16px, 2.8vw, 42px); display: flex; flex-direction: column; gap: clamp(10px, 2.5dvh, 24px); }
    .dashboard-intro { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .dashboard-intro h1 { color: #0f172a; font-size: 26px; font-weight: 800; line-height: 1.2; letter-spacing: -0.5px; }
    .dashboard-intro p { color: var(--text-muted); font-size: 13px; margin-top: 6px; }
    
    .page-header { display: flex; justify-content: space-between; align-items: flex-end; }
    .page-title h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; color: var(--primary-navy); }
    .page-title p { font-size: 14px; color: var(--text-muted); }
    .btn-outline { background: #fff; border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 8px; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
    .stat-card, .card { min-width: 0; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 3px 10px #10264b06; }
    .stat-card { position: relative; min-height: clamp(112px, 17dvh, 166px); padding: clamp(14px, 1.8vw, 23px); }
    .dashboard-link { color: inherit; text-decoration: none; }
    .stat-card.dashboard-link:hover { border-color: var(--accent); }
    .card-title .dashboard-link:hover { text-decoration: underline; }
    .dashboard-link:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
    .stat-card:nth-child(1) { --accent: #1d4ed8; --tint: #eff6ff; }
    .stat-card:nth-child(2) { --accent: #0f766e; --tint: #ecfdf5; }
    .stat-card:nth-child(3) { --accent: #6d28d9; --tint: #f5f3ff; }
    .stat-card:nth-child(4) { --accent: #a15206; --tint: #fffbeb; }
    .stat-heading { min-height: 30px; padding-right: 37px; margin-bottom: clamp(6px, 1.5dvh, 17px); }
    .stat-icon { position: absolute; top: 13px; right: 13px; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; color: var(--accent); background: var(--tint); font-size: 19px; font-weight: 700; }
    .stat-icon svg { width: 19px; height: 19px; }
    .stat-header { font-size: 13px; font-weight: 600; color: #414b60; }
    .stat-val { color: #10264b; font-size: clamp(19px, 2vw, 28px); line-height: 1.2; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .stat-note { margin-top: 6px; font-size: 12px; color: var(--text-muted); }
    .bottom-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(230px, 1fr) minmax(0, 2.05fr); grid-template-rows: minmax(0, 1fr); gap: 20px; }
    .card-title { padding: 15px 16px; border-bottom: 1px solid #e8edf4; font-size: 15px; font-weight: 700; color: #10264b; }
    .card { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .dashboard-empty { flex: 1; min-height: 0; overflow: auto; display: grid; place-content: safe center; justify-items: center; gap: 10px; padding: 12px; color: #64748b; font-size: 13px; text-align: center; }
    .dashboard-empty-icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: #f1f5fa; color: #8595af; font-size: 21px; }
    .actions-list { min-height: 0; overflow: auto; list-style: none; padding: 0 16px; }
    .actions-list { flex: 1; display: flex; flex-direction: column; }
    .actions-list .action-item { flex: 0 0 auto; min-height: 76px; padding-block: 16px; }
    .actions-list .action-content h3 + p,
    .actions-list .action-status + p { margin-top: 6px; }
    .action-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
    .action-icon { display: grid; place-items: center; width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; color: #194894; background: #e0e9ff; }
    .action-item:last-child { border-bottom: none; }
    .action-content { min-width: 0; flex: 1; overflow-wrap: anywhere; }
    .action-item h3 { font-size: 14px; font-weight: 600; }
    .action-item p, .action-item time { font-size: 13px; color: var(--text-muted); }
    .action-state { text-align: right; }
    .action-status { display: inline-block; border-radius: 999px; padding: 3px 8px; background: #eff6ff; color: #1e40af; font-size: 11px; font-weight: 600; }
    .action-status.is-positive { background: #e6f7ee; color: #137452; }
    .action-status.is-pending { background: #fff4da; color: #87520a; }
    .action-status.is-negative { background: #fff0ed; color: #af3b29; }
    .activity-table-wrap { min-height: 0; overflow: auto; }
    .activity-table-wrap { flex: 1; }
    .activity-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    .activity-table th, .activity-table td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; overflow-wrap: anywhere; }
    .activity-table th { color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
    .activity-table td { padding-block: clamp(10px, 2.1dvh, 22px); }
    .activity-table { height: 100%; }
    .activity-table thead { height: 36px; }
    .activity-table tr:last-child td { border-bottom: 0; }
    .activity-reference { color: var(--text-muted); font-variant-numeric: tabular-nums; }
    @media (min-width: 851px) and (max-height: 799px) {
      .actions-list > li:nth-child(n+6) { display: none; }
    }
    @media (min-width: 851px) and (max-height: 699px) {
      .actions-list > li:nth-child(n+4) { display: none; }
    }
    @media (max-width: 1020px) {
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .content-area { padding: 18px; }
    }
    @media (max-width: 850px) {
      .bottom-grid { grid-template-columns: 1fr; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .stat-card { min-height: 0; padding: 10px; }
      .stat-heading { min-height: 20px; margin-bottom: 4px; }
      .card-title { padding-block: 8px; }
    }
    @media (max-width: 760px) {
      body.dashboard-page { flex-direction: column; }
    }
    @media (max-width: 480px) {
      .stats-grid { gap: 12px; }
      .content-area { padding: 16px; }
      .stat-card { padding: 10px; }
    }

    /* Modal Overlay */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 2000; opacity: 0; visibility: hidden; transition: all 0.2s ease; }
    .modal-backdrop.show { opacity: 1; visibility: visible; }
    .modal-card { background-color: #ffffff; border-radius: 12px; padding: 32px; width: 90%; max-width: 440px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; transform: scale(0.95); transition: transform 0.2s ease; }
    .modal-backdrop.show .modal-card { transform: scale(1); }
    
    /* Toast Banner */
    .toast-banner { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background-color: #1e3a8a; color: #ffffff; padding: 14px 20px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25); display: flex; align-items: center; gap: 12px; z-index: 99999; font-size: 13.5px; font-weight: 600; opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; max-width: 90%; min-width: 300px; }
    .toast-banner.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
    .toast-banner.success { background-color: #16a34a; }
    .toast-banner.error { background-color: #e11d48; }
    .toast-banner.info { background-color: #0c5ad2; }
    .toast-banner-icon { width: 22px; height: 22px; flex-shrink: 0; }
    .toast-banner-text { flex: 1; line-height: 1.45; }
    .toast-banner-close { background: none; border: none; color: rgba(255, 255, 255, 0.85); cursor: pointer; padding: 3px; display: flex; align-items: center; justify-content: center; border-radius: 4px; transition: background-color 0.2s; }
    .toast-banner-close:hover { background-color: rgba(255, 255, 255, 0.2); color: #ffffff; }
  </style>
</head>
<body class="dashboard-page">

  <!-- Sidebar -->
  <aside class="sidebar" data-admin-sidebar="Dashboard" aria-label="Admin navigation"></aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="admin-header" data-admin-header data-page-title="Dashboard"></header>

    <div class="content-area">
      <div class="dashboard-intro">
        <div>
          <h1 id="dashboardTitle">Dashboard</h1>
          <p id="dashboardStatus" role="status">Loading dashboard data…</p>
        </div>
      </div>
      <section class="stats-grid" id="dashboardMetrics" aria-label="Key metrics"></section>
      <div class="bottom-grid" id="dashboardPanels"></div>
    </div>
  </main>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="../accountManagementModule/auth.js"></script>
  <script src="dashboard.js"></script>
  <script src="adminHeader.js"></script>
  <script src="../adminSidebar.js"></script>
</body>
</html>
