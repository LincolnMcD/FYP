<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Management - ReByte</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="adminHeader.css">
  <style>
    :root { --navy:#082f72; --blue:#0b4fb3; --page:#f5f7fb; --border:#e2e6ee; --text:#172033; --muted:#717b8e; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; background:var(--page); color:var(--text); font-family:Inter,Arial,sans-serif; }
    button,input { font:inherit; }
    .sidebar { width:260px; background:#fff; border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
    .brand { height:105px; display:flex; align-items:center; gap:10px; padding:0 28px; border-bottom:1px solid #edf0f4; }
    .brand img { width:38px; height:38px; object-fit:contain; }
    .brand span { color:#10264b; font-size:25px; font-weight:700; letter-spacing:-1px; }
    .nav-list { list-style:none; padding:22px 16px; margin:0; display:grid; gap:8px; flex:1; align-content:start; }
    .nav-item { min-height:48px; padding:0 14px; display:flex; align-items:center; gap:12px; border-radius:9px; color:#586579; text-decoration:none; font-size:14px; font-weight:500; }
    .nav-item svg { width:20px; height:20px; flex:0 0 auto; }
    .nav-item:hover { background:#f1f4f9; }
    .nav-item.active { color:#fff; background:var(--navy); }
    .main { min-width:0; flex:1; display:flex; flex-direction:column; }
    .content { padding:30px 40px 48px; }
    .back { display:inline-flex; padding:8px; color:#5d6572; text-decoration:none; margin:0 0 28px -8px; }
    .back svg { width:20px; height:20px; }
    .title-row { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin:0 16px 22px; }
    h1 { margin:0 0 8px; color:#161a20; font-size:clamp(25px,2.2vw,34px); line-height:1.2; letter-spacing:-1px; }
    .subtitle { margin:0; color:#5d6472; font-size:16px; }
    .customer-card { margin:0 16px; background:#fff; border:1px solid #edf0f4; border-radius:18px; box-shadow:0 5px 18px #1a2b4510; overflow:hidden; }
    .toolbar { min-height:76px; padding:14px 26px; display:flex; align-items:center; justify-content:space-between; gap:20px; border-bottom:1px solid var(--border); }
    .tabs { min-height:48px; display:flex; align-items:stretch; gap:22px; }
    .tab { position:relative; padding:0 4px; color:#4e5564; background:none; border:0; cursor:pointer; font-size:14px; }
    .tab.active { color:#0646a5; font-weight:700; }
    .tab.active::after { position:absolute; content:''; height:2px; background:#0646a5; bottom:0; left:0; right:0; }
    .search { height:44px; width:min(350px,40vw); display:flex; align-items:center; gap:12px; padding:0 14px; border:1px solid #c9cddd; border-radius:14px; background:#fafaff; color:#7d8493; }
    .search svg { width:18px; height:18px; flex:0 0 auto; }
    .search input { min-width:0; width:100%; border:0; outline:0; background:transparent; color:var(--text); font-size:14px; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; table-layout:fixed; min-width:900px; }
    th { height:54px; padding:0 20px; text-align:left; color:#555b68; font-size:12px; letter-spacing:.3px; font-weight:700; border-bottom:1px solid #cfd4df; white-space:nowrap; }
    th:nth-child(1),td:nth-child(1) { width:145px; }
    th:nth-child(2),td:nth-child(2) { width:220px; }
    th:nth-child(3),td:nth-child(3) { width:270px; }
    th:nth-child(4),td:nth-child(4) { width:180px; }
    th:nth-child(5),td:nth-child(5) { width:155px; }
    th:nth-child(6),td:nth-child(6) { width:125px; padding-left:4px; padding-right:10px; text-align:left; }
    .sort-button { display:inline-flex; align-items:center; gap:6px; padding:8px 0; border:0; background:transparent; color:inherit; font:inherit; letter-spacing:inherit; cursor:pointer; }
    .sort-arrow { color:#8a93a3; font-size:14px; line-height:1; }
    .sort-arrow.active { color:#0646a5; }
    td { height:76px; padding:0 20px; color:#6b7180; font-size:14px; border-bottom:1px solid #e9ebf0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    tbody tr:last-child td { border-bottom:0; }
    tbody tr[data-customer-id] { cursor:pointer; }
    tbody tr[data-customer-id]:hover { background:#f7f9fd; }
    tbody tr[data-customer-id]:focus-visible { outline:2px solid #0b4fb3; outline-offset:-2px; }
    td:first-child { color:#596274; font-family:ui-monospace,Consolas,monospace; }
    td:nth-child(2) { color:#25344f; font-weight:600; }
    .status { display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:20px; font-size:12px; font-weight:700; }
    .status::before { content:''; width:8px; height:8px; border-radius:50%; background:currentColor; }
    .status-active { color:#173a75; background:#dce5ff; }
    .status-suspended { color:#9a4d0b; background:#ffdfc9; }
    .status-banned { color:#b4232f; background:#ffdada; }
    .action-buttons { display:flex; align-items:center; justify-content:flex-start; gap:4px; }
    .icon-action { width:34px; height:34px; display:grid; place-items:center; padding:0; border:0; border-radius:8px; background:transparent; color:#dc2626; cursor:pointer; }
    .icon-action:hover { background:#fff1f2; }
    .icon-action svg { width:20px; height:20px; }
    .restore-action { min-height:40px; padding:0 12px; border:1px solid #22c55e; border-radius:22px; background:#fff; color:#16a34a; font-weight:600; cursor:pointer; }
    .restore-action:hover { background:#f0fdf4; }
    .empty { display:none; padding:42px 16px; color:var(--muted); text-align:center; }
    .card-footer { min-height:72px; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-top:1px solid #e9ebf0; color:#5d6472; font-size:14px; }
    .pagination { display:flex; align-items:center; gap:8px; }
    .page-button { min-width:38px; height:38px; padding:0 12px; border:1px solid #cbd1df; border-radius:12px; background:#fff; color:#52596a; cursor:pointer; }
    .page-button.current { color:#fff; border-color:#0646a5; background:#0646a5; }
    .page-button:disabled { color:#aeb3bd; cursor:default; }
    .confirm-backdrop[hidden] { display:none !important; }
    .confirm-backdrop { position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; background:#0f172a99; opacity:0; visibility:hidden; transition:all .2s ease; }
    .confirm-backdrop.show { opacity:1; visibility:visible; }
    .confirm-card { width:min(100%,440px); max-height:min(90vh,760px); overflow:auto; border-radius:18px; background:#fff; box-shadow:0 20px 40px #0f172a33; transform:scale(.96); transition:transform .2s ease; }
    .confirm-backdrop.show .confirm-card { transform:scale(1); }
    .confirm-head { display:flex; align-items:center; gap:14px; padding:20px 22px 16px; border-bottom:1px solid #e7eaf0; }
    .confirm-icon { width:38px; height:38px; display:grid; place-items:center; flex:0 0 38px; border-radius:50%; background:#fee2e2; color:#b91c1c; }
    .confirm-icon.success { background:#dcfce7; color:#15803d; }
    .confirm-icon svg { width:20px; height:20px; }
    .confirm-head h2 { margin:0 0 4px; color:#10264b; font-size:16px; }
    .confirm-head p { margin:0; color:#566174; font-size:12px; }
    .confirm-body { padding:18px 22px; color:#51596a; font-size:13px; line-height:1.55; }
    .confirm-person { margin-bottom:12px; padding:12px; border:1px solid #d9def0; border-radius:12px; background:#f1f3ff; color:#10264b; font-weight:700; }
    .confirm-notice { margin-bottom:16px; padding:9px 11px; border:1px solid #fecaca; border-radius:8px; background:#fef2f2; color:#b91c1c; }
    .confirm-notice.success { border-color:#bbf7d0; background:#f0fdf4; color:#15803d; }
    .confirm-reason-label { display:block; margin-top:16px; color:#10264b; font-size:12px; font-weight:600; }
    .confirm-reason { display:block; width:100%; min-height:80px; margin-top:6px; padding:11px; resize:vertical; border:1px solid #c9cddd; border-radius:12px; background:#fafaff; color:var(--text); font:inherit; font-size:13px; }
    .confirm-reason-meta { display:flex; justify-content:space-between; gap:12px; margin-top:5px; color:#667085; font-size:11px; font-weight:400; }
    .confirm-word-count.over-limit { color:#dc2626; font-weight:600; }
    .confirm-reason:focus { outline:2px solid #c7d2fe; border-color:#5473c4; }
    .confirm-error { display:none; margin-top:5px; color:#dc2626; font-size:12px; }
    .confirm-email { display:flex; align-items:flex-start; gap:8px; margin-top:14px; color:#4e5564; }
    .confirm-email input { margin:3px 0 0; accent-color:#0646a5; }
    .confirm-notice[hidden],.confirm-reason-label[hidden],.confirm-email[hidden] { display:none !important; }
    .confirm-actions { display:flex; justify-content:flex-end; gap:10px; padding:12px 22px 18px; border-top:1px solid #e7eaf0; }
    .confirm-actions button { min-height:40px; padding:0 16px; border:1px solid #d4d9e3; border-radius:22px; background:#fff; color:#344054; font-size:12px; font-weight:600; cursor:pointer; }
    .confirm-actions .confirm-submit { border-color:#b91c1c; background:#b91c1c; color:#fff; }
    .confirm-actions .confirm-submit.success { border-color:#16a34a; background:#16a34a; }
    .confirm-actions .confirm-submit.success:hover { background:#15803d; }
    .confirm-actions .confirm-submit:disabled { opacity:.6; cursor:wait; }
    @media(max-width:900px) { .sidebar{width:220px}.content{padding:24px 20px 36px}.title-row,.customer-card{margin-left:0;margin-right:0}.toolbar{padding:12px 18px} }
    @media(max-width:650px) { body{display:block}.sidebar{width:100%}.brand{height:72px}.nav-list{display:flex;overflow-x:auto;padding:10px}.nav-item{flex:0 0 auto}.nav-list .nav-item:not(.active){display:none}.content{padding:18px 12px}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.card-footer{align-items:flex-start;flex-direction:column} }
  </style>
</head>

    </nav>

  <main class="main">
    <header class="admin-header" data-admin-header data-page-title="Customer Management"></header>
    <section class="content">
      <a class="back" href="adminDashboard.html" aria-label="Back to admin dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"></path><path d="M9 12h12"></path></svg></a>
      <div class="title-row"><div><h1>Customer Account Management</h1><p class="subtitle">Overview and management of customer accounts.</p></div></div>
      <section class="customer-card" aria-label="Customer accounts">
        <div class="toolbar">
          <div class="tabs" role="tablist" aria-label="Customer status">
            <button class="tab active" type="button" role="tab" aria-selected="true" data-status="all">All</button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-status="active">Active</button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-status="suspended">Suspended</button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-status="banned">Banned</button>
          </div>
          <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="6.5"></circle><path d="m16 16 5 5"></path></svg><input id="customerSearch" type="search" placeholder="Search Name, Email, or User ID" aria-label="Search customers"></label>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th data-sort-column="id" aria-sort="ascending"><button class="sort-button" type="button" data-sort="id">USER ID <span class="sort-arrow active" aria-hidden="true">↑</span></button></th><th data-sort-column="name" aria-sort="none"><button class="sort-button" type="button" data-sort="name">NAME <span class="sort-arrow" aria-hidden="true">↕</span></button></th><th>EMAIL</th><th>STATUS</th><th>CREATED</th><th>ACTIONS</th></tr></thead>
            <tbody id="customerRows"></tbody>
          </table>
          <div class="empty" id="emptyState">No customers found.</div>
        </div>
        <footer class="card-footer"><span id="resultCount">Showing 0 entries</span><div class="pagination" id="customerPagination" aria-label="Customer pages"></div></footer>
      </section>
    </section>
  </main>
  <div class="confirm-backdrop" id="customerConfirmModal" hidden>
    <section class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmQuestion">
      <header class="confirm-head"><span class="confirm-icon" id="confirmIcon"></span><div><h2 id="confirmTitle"></h2><p id="confirmQuestion"></p></div></header>
      <div class="confirm-body">
        <div class="confirm-person" id="confirmCustomerName"></div>
        <div class="confirm-notice" id="confirmNotice" hidden></div>
        <span id="confirmDescription"></span>
        <label class="confirm-reason-label" id="confirmReasonWrap" hidden><span id="confirmReasonTitle"></span><textarea class="confirm-reason" id="confirmReason" placeholder="Provide a reason (up to 30 words)..."></textarea><span class="confirm-reason-meta"><span id="confirmReasonHint">Enter up to 30 words.</span><span class="confirm-word-count" id="confirmWordCount">0 / 30 words</span></span><span class="confirm-error" id="confirmReasonError">Please provide a reason before continuing.</span></label>
        <label class="confirm-email" id="confirmEmailWrap" hidden><input type="checkbox" id="confirmEmail" checked><span id="confirmEmailText"></span></label>
      </div>
      <footer class="confirm-actions"><button id="cancelCustomerAction" type="button">Cancel</button><button class="confirm-submit" id="confirmCustomerAction" type="button"></button></footer>
    </section>
  </div>
  <script src="../accountManagementModule/auth.js"></script>
  <script>
    const adminUser = ReByteAuth.getUser();
    if (!adminUser || adminUser.role !== 'Admin') window.location.href = '../accountManagementModule/login.html';
    const customerRows = document.getElementById('customerRows');
    const customerSearch = document.getElementById('customerSearch');
    const customerPagination = document.getElementById('customerPagination');
    const customerConfirmModal = document.getElementById('customerConfirmModal');
    const confirmCustomerActionButton = document.getElementById('confirmCustomerAction');
    const sortButtons = [...document.querySelectorAll('.sort-button[data-sort]')];
    const PAGE_SIZE = 5;
    let customers = [];
    let activeFilter = 'all';
    let currentPage = 1;
    let sortKey = 'id';
    let sortDirection = 'asc';
    let pendingCustomer = null;
    let pendingStatus = '';

    function dateLabel(value) {
      const seconds = value?._seconds ?? value?.seconds;
      if (value?.toMillis) return new Date(value.toMillis()).toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
      if (typeof value === 'string' || value instanceof Date) return new Date(value).toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
      if (!seconds) return 'N/A';
      return new Date(seconds * 1000).toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
    }

    function remainingSuspension(customer) {
      const until = customer.suspendedUntil;
      const millis = until?._seconds != null ? until._seconds * 1000
        : until?.seconds != null ? until.seconds * 1000
          : until?.toMillis ? until.toMillis()
            : until ? new Date(until).getTime() : NaN;
      if (!Number.isFinite(millis)) return 'The automatic reactivation time is unavailable.';
      const remaining = millis - Date.now();
      if (remaining <= 0) return 'The 7-day suspension period has ended and the account will reactivate shortly.';
      const days = Math.ceil(remaining / (24 * 60 * 60 * 1000));
      return `This customer will automatically reactivate in ${days} ${days === 1 ? 'day' : 'days'}.`;
    }

    function wordCount(value) {
      return value.trim() ? value.trim().split(/\s+/).length : 0;
    }

    function customerKey(customer) { return String(customer.id || customer.userId || ''); }
    function customerDisplayId(customer) {
      const raw = String(customer.userId || customer.id || '').replace(/[^a-z0-9]/gi, '').toUpperCase();
      return `#USR-${raw.slice(-6) || 'UNKNOWN'}`;
    }

    function createActionButton(label, className, icon, customer, targetStatus) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = className;
      button.setAttribute('aria-label', label);
      button.title = label;
      button.innerHTML = icon;
      button.dataset.customerId = customerKey(customer);
      button.dataset.targetStatus = targetStatus;
      button.addEventListener('click', () => openConfirmation(customer, targetStatus));
      return button;
    }

    function statusActions(customer) {
      const actions = document.createElement('div');
      actions.className = 'action-buttons';
      const current = String(customer.status || 'Active').toLowerCase();
      if (current === 'active') {
        actions.append(
          createActionButton('Suspend customer', 'icon-action', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9 9v6m6-6v6"></path></svg>', customer, 'Suspended'),
          createActionButton('Ban customer', 'icon-action', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="m5 5 14 14"></path></svg>', customer, 'Banned')
        );
      } else {
        const label = current === 'banned' ? 'Unban' : 'Reactivate';
        const button = createActionButton(label, 'restore-action', '', customer, 'Active');
        button.textContent = label;
        actions.append(button);
      }
      return actions;
    }

    function filteredCustomers() {
      const query = customerSearch.value.trim().toLowerCase();
      return customers.filter(customer => {
        const status = String(customer.status || 'Active').toLowerCase();
        const matchesStatus = activeFilter === 'all' || status === activeFilter;
        const searchable = `${customerDisplayId(customer)} ${customer.userId || ''} ${customer.id || ''} ${customer.fullName || ''} ${customer.email || ''}`.toLowerCase();
        return matchesStatus && searchable.includes(query);
      }).sort((a, b) => {
        const valueA = sortKey === 'id' ? customerDisplayId(a) : String(a.fullName || 'Customer');
        const valueB = sortKey === 'id' ? customerDisplayId(b) : String(b.fullName || 'Customer');
        const comparison = valueA.localeCompare(valueB, undefined, { numeric:true, sensitivity:'base' });
        return sortDirection === 'asc' ? comparison : -comparison;
      });
    }

    function renderCustomers() {
      const result = filteredCustomers();
      const pageCount = Math.max(1, Math.ceil(result.length / PAGE_SIZE));
      currentPage = Math.min(currentPage, pageCount);
      const start = result.length ? (currentPage - 1) * PAGE_SIZE : 0;
      const page = result.slice(start, start + PAGE_SIZE);
      customerRows.replaceChildren();
      page.forEach(customer => {
        const status = String(customer.status || 'Active');
        const row = document.createElement('tr');
        const idCell = document.createElement('td'); idCell.textContent = customerDisplayId(customer);
        const nameCell = document.createElement('td'); nameCell.textContent = customer.fullName || 'Customer';
        const emailCell = document.createElement('td'); emailCell.textContent = customer.email || '—';
        const statusCell = document.createElement('td');
        const badge = document.createElement('span'); badge.className = `status status-${status.toLowerCase()}`; badge.textContent = status.charAt(0).toUpperCase() + status.slice(1).toLowerCase();
        statusCell.append(badge);
        const createdCell = document.createElement('td'); createdCell.textContent = dateLabel(customer.createdAt);
        const actionsCell = document.createElement('td'); actionsCell.append(statusActions(customer));
        row.append(idCell, nameCell, emailCell, statusCell, createdCell, actionsCell);
        row.dataset.customerId = customerKey(customer);
        row.tabIndex = 0;
        row.setAttribute('aria-label', `View account details for ${customer.fullName || customer.email || 'customer'}`);
        const openDetails = () => { window.location.href = `customerAccountDetail.html?customerId=${encodeURIComponent(customerKey(customer))}`; };
        row.addEventListener('click', event => { if (!event.target.closest('button')) openDetails(); });
        row.addEventListener('keydown', event => {
          if ((event.key === 'Enter' || event.key === ' ') && !event.target.closest('button')) {
            event.preventDefault();
            openDetails();
          }
        });
        customerRows.append(row);
      });
      document.getElementById('emptyState').style.display = result.length ? 'none' : 'block';
      document.getElementById('resultCount').textContent = result.length
        ? `Showing ${start + 1} to ${Math.min(start + PAGE_SIZE, result.length)} of ${result.length} entries`
        : 'Showing 0 entries';
      customerPagination.innerHTML = [
        `<button class="page-button" type="button" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>`,
        ...Array.from({ length: pageCount }, (_, index) => {
          const number = index + 1;
          return `<button class="page-button${number === currentPage ? ' current' : ''}" type="button" data-page="${number}"${number === currentPage ? ' aria-current="page"' : ''}>${number}</button>`;
        }),
        `<button class="page-button" type="button" data-page="${currentPage + 1}" ${currentPage === pageCount ? 'disabled' : ''}>Next</button>`
      ].join('');
    }

    function openConfirmation(customer, targetStatus) {
      pendingCustomer = customer;
      pendingStatus = targetStatus;
      const current = String(customer.status || 'Active').toLowerCase();
      const isSuspend = targetStatus === 'Suspended';
      const isBan = targetStatus === 'Banned';
      const isUnban = targetStatus === 'Active' && current === 'banned';
      const isRestore = targetStatus === 'Active' && !isUnban;
      const title = isSuspend ? 'Suspend User Account' : isBan ? 'Ban User Account' : isUnban ? 'Unban User Account' : 'Reactivate User Account';
      const description = isSuspend
        ? 'This customer will lose access for 7 days. Their account will reactivate automatically when the suspension ends.'
        : isBan
          ? 'This customer will lose access until an administrator unbans the account.'
          : isUnban
            ? 'This will remove the ban and restore the customer’s access to ReByte.'
            : 'This will end the suspension and restore the customer’s access to ReByte.';
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmQuestion').textContent = isSuspend ? 'Temporary account restriction' : isBan ? 'Permanent account restriction' : 'Restore customer access';
      document.getElementById('confirmCustomerName').textContent = `${customer.fullName || 'Customer'} · ${customer.email || customerDisplayId(customer)}`;
      document.getElementById('confirmDescription').textContent = description;
      const icon = document.getElementById('confirmIcon');
      icon.classList.toggle('success', isRestore || isUnban);
      icon.innerHTML = isRestore || isUnban
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"></path></svg>'
        : isBan
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="m5 5 14 14"></path></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9 9v6m6-6v6"></path></svg>';
      const notice = document.getElementById('confirmNotice');
      notice.hidden = !(isSuspend || isBan || isRestore || isUnban);
      notice.classList.toggle('success', isRestore || isUnban);
      notice.textContent = isSuspend ? 'Active trade-ins will be paused.'
        : isBan ? 'Account access will remain blocked until an administrator unbans this customer.'
          : isRestore ? remainingSuspension(customer)
            : isUnban ? 'The customer will regain access after the ban is removed.' : '';
      const reasonWrap = document.getElementById('confirmReasonWrap');
      reasonWrap.hidden = !(isSuspend || isBan);
      document.getElementById('confirmReasonTitle').textContent = isSuspend ? 'Suspension Reason *' : 'Ban Reason *';
      document.getElementById('confirmReason').value = '';
      document.getElementById('confirmReasonHint').textContent = 'Enter up to 30 words.';
      document.getElementById('confirmWordCount').textContent = '0 / 30 words';
      document.getElementById('confirmWordCount').classList.remove('over-limit');
      document.getElementById('confirmReasonError').style.display = 'none';
      document.getElementById('confirmReason').setAttribute('aria-invalid', 'false');
      const emailWrap = document.getElementById('confirmEmailWrap');
      emailWrap.hidden = !(isSuspend || isBan);
      document.getElementById('confirmEmail').checked = true;
      document.getElementById('confirmEmailText').textContent = isSuspend
        ? 'Send automated suspension notice via email.'
        : 'Send automated ban notice via email.';
      confirmCustomerActionButton.textContent = isSuspend ? 'Confirm Suspension' : isBan ? 'Confirm Ban' : isUnban ? 'Unban Customer' : 'Reactivate Customer';
      confirmCustomerActionButton.classList.toggle('success', isRestore || isUnban);
      customerConfirmModal.hidden = false;
      requestAnimationFrame(() => customerConfirmModal.classList.add('show'));
    }

    function closeConfirmation() {
      customerConfirmModal.classList.remove('show');
      pendingCustomer = null;
      pendingStatus = '';
      setTimeout(() => { customerConfirmModal.hidden = true; }, 200);
    }

    async function loadCustomers() {
      const result = await ReByteAuth.getCustomerList();
      if (!result.success) {
        ReByteAuth.showToast(result.error || 'Could not load customer records.', 'error');
        return;
      }
      customers = Array.isArray(result.data) ? result.data : [];
      renderCustomers();
    }

    document.querySelectorAll('.tab[data-status]').forEach(tab => tab.addEventListener('click', () => {
      activeFilter = tab.dataset.status;
      currentPage = 1;
      document.querySelectorAll('.tab[data-status]').forEach(item => {
        const selected = item === tab;
        item.classList.toggle('active', selected);
        item.setAttribute('aria-selected', String(selected));
      });
      renderCustomers();
    }));
    customerSearch.addEventListener('input', () => { currentPage = 1; renderCustomers(); });
    sortButtons.forEach(button => button.addEventListener('click', () => {
      if (sortKey === button.dataset.sort) {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        sortKey = button.dataset.sort;
        sortDirection = 'asc';
      }
      currentPage = 1;
      sortButtons.forEach(sortButton => {
        const active = sortButton.dataset.sort === sortKey;
        const column = sortButton.closest('th');
        const arrow = sortButton.querySelector('.sort-arrow');
        column.setAttribute('aria-sort', active ? (sortDirection === 'asc' ? 'ascending' : 'descending') : 'none');
        arrow.textContent = active ? (sortDirection === 'asc' ? '↑' : '↓') : '↕';
        arrow.classList.toggle('active', active);
      });
      renderCustomers();
    }));
    customerPagination.addEventListener('click', event => {
      const button = event.target.closest('button[data-page]');
      if (!button || button.disabled) return;
      currentPage = Number(button.dataset.page);
      renderCustomers();
    });
    document.getElementById('cancelCustomerAction').addEventListener('click', closeConfirmation);
    const confirmReasonInput = document.getElementById('confirmReason');
    const confirmReasonHint = document.getElementById('confirmReasonHint');
    confirmReasonInput.addEventListener('beforeinput', event => {
      if (event.isComposing || event.inputType.startsWith('delete')) return;
      const insertedText = event.data ?? event.dataTransfer?.getData('text/plain') ?? event.clipboardData?.getData('text/plain') ?? '';
      const start = confirmReasonInput.selectionStart;
      const end = confirmReasonInput.selectionEnd;
      const proposed = confirmReasonInput.value.slice(0, start) + insertedText + confirmReasonInput.value.slice(end);
      if (wordCount(proposed) > 30) {
        event.preventDefault();
        confirmReasonHint.textContent = 'Maximum 30 words. Extra text was not added.';
      }
    });
    confirmReasonInput.addEventListener('input', event => {
      const words = event.target.value.trim() ? event.target.value.trim().split(/\s+/) : [];
      if (words.length > 30) {
        event.target.value = words.slice(0, 30).join(' ');
        event.target.setSelectionRange(event.target.value.length, event.target.value.length);
      }
      const count = wordCount(event.target.value);
      document.getElementById('confirmWordCount').textContent = `${count} / 30 words`;
      document.getElementById('confirmWordCount').classList.toggle('over-limit', count > 30);
      if (count <= 30) confirmReasonHint.textContent = 'Enter up to 30 words.';
      if (event.target.value.trim()) {
        document.getElementById('confirmReasonError').style.display = 'none';
        event.target.setAttribute('aria-invalid', 'false');
      }
    });
    customerConfirmModal.addEventListener('click', event => { if (event.target === customerConfirmModal) closeConfirmation(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && !customerConfirmModal.hidden) closeConfirmation(); });
    confirmCustomerActionButton.addEventListener('click', async () => {
      if (!pendingCustomer || !pendingStatus) return;
      const needsReason = pendingStatus === 'Suspended' || pendingStatus === 'Banned';
      const reason = document.getElementById('confirmReason').value.trim();
      if (needsReason && (!reason || wordCount(reason) > 30)) {
        const reasonError = document.getElementById('confirmReasonError');
        reasonError.style.display = 'block';
        reasonError.textContent = reason ? 'Reason must be 30 words or fewer.' : 'Please provide a reason before continuing.';
        document.getElementById('confirmReason').setAttribute('aria-invalid', 'true');
        document.getElementById('confirmReason').focus();
        return;
      }
      confirmCustomerActionButton.disabled = true;
      confirmCustomerActionButton.textContent = 'Updating...';
      try {
        const result = await ReByteAuth.setCustomerStatus(customerKey(pendingCustomer), pendingStatus, {
          reason,
          notifyByEmail: needsReason && document.getElementById('confirmEmail').checked
        });
        if (!result.success) {
          ReByteAuth.showToast(result.error || 'Could not update this customer.', 'error');
          return;
        }
        const message = result.message;
        closeConfirmation();
        await loadCustomers();
        ReByteAuth.showToast(message, 'success');
      } catch (error) {
        ReByteAuth.showToast(error.message || 'Could not update this customer.', 'error');
      } finally {
        confirmCustomerActionButton.disabled = false;
      }
    });

    document.querySelectorAll('.nav-item[href="#"]').forEach(link => link.addEventListener('click', event => event.preventDefault()));
    loadCustomers();
  </script>
  <script src="adminHeader.js"></script>
</body>
</html>
