<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Management - ReByte</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="adminHeader.css">
  <style>
    :root {
      --navy: #082f72;
      --blue: #0b4fb3;
      --page: #f5f7fb;
      --border: #e2e6ee;
      --text: #172033;
      --muted: #717b8e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; background: var(--page); color: var(--text); font-family: Inter, Arial, sans-serif; }
    button, input { font: inherit; }
    .sidebar { width: 260px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .brand { height: 105px; display: flex; align-items: center; gap: 10px; padding: 0 28px; border-bottom: 1px solid #edf0f4; }
    .brand img { width: 38px; height: 38px; object-fit: contain; }
    .brand span { color: #10264b; font-size: 25px; font-weight: 700; letter-spacing: -1px; }
    .nav-list { list-style: none; padding: 22px 16px; margin: 0; display: grid; gap: 8px; flex: 1; align-content: start; }
    .nav-item { min-height: 48px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border-radius: 9px; color: #586579; text-decoration: none; font-size: 14px; font-weight: 500; }
    .nav-item svg { width: 20px; height: 20px; flex: 0 0 auto; }
    .nav-item:hover { background: #f1f4f9; }
    .nav-item.active { color: #fff; background: var(--navy); }
    .main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
    .topbar { min-height: 105px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: #fff; border-bottom: 1px solid var(--border); }
    .topbar-title { color: #173a75; font-size: 20px; font-weight: 700; }
    .topbar-right { display: flex; align-items: center; gap: 28px; color: #7a8496; font-size: 14px; }
    .profile { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; color: #828a98; background: #f0f1f4; cursor: pointer; }
    .profile-dropdown { position: absolute; top: 55px; right: 0; background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 160px; display: none; z-index: 10; }
    .profile-dropdown.show { display: block; }
    .dropdown-item { padding: 12px 16px; display: block; text-decoration: none; color: #172033; font-size: 14px; font-weight: 500; cursor: pointer; border: none; background: none; width: 100%; text-align: left; }
    .dropdown-item:hover { background-color: #f1f4f9; }
    .content { padding: 30px 40px 48px; }
    .back { display: inline-flex; padding: 8px; color: #5d6572; text-decoration: none; margin: 0 0 28px -8px; }
    .back svg { width: 20px; height: 20px; }
    .title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 0 16px 22px; }
    h1 { margin: 0 0 8px; color: #161a20; font-size: clamp(25px, 2.2vw, 34px); line-height: 1.2; letter-spacing: -1px; }
    .subtitle { margin: 0; color: #5d6472; font-size: 16px; }
    .add-button { min-height: 44px; border: 0; border-radius: 24px; padding: 0 18px; display: inline-flex; align-items: center; gap: 9px; background: #0646a5; color: #fff; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .staff-card { margin: 0 16px; background: #fff; border: 1px solid #edf0f4; border-radius: 18px; box-shadow: 0 5px 18px #1a2b4510; overflow: hidden; }
    .toolbar { min-height: 76px; padding: 14px 26px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--border); }
    .tabs { height: 48px; display: flex; align-items: stretch; gap: 28px; }
    .tab { position: relative; padding: 0 4px; color: #4e5564; background: none; border: 0; cursor: pointer; font-size: 14px; }
    .tab.active { color: #0646a5; font-weight: 600; }
    .tab.active::after { position: absolute; content: ''; height: 2px; background: #0646a5; bottom: 0; left: 0; right: 0; }
    .search { height: 44px; width: min(300px, 38vw); display: flex; align-items: center; gap: 12px; padding: 0 14px; border: 1px solid #c9cddd; border-radius: 14px; background: #fafaff; color: #7d8493; }
    .search svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .search input { min-width: 0; width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 14px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 1185px; }
    th { height: 54px; padding: 0 20px; text-align: left; color: #555b68; font-size: 12px; letter-spacing: .3px; font-weight: 700; border-bottom: 1px solid #cfd4df; white-space: nowrap; }
    th:nth-child(1), td:nth-child(1) { width: 125px; }
    th:nth-child(2), td:nth-child(2) { width: 35ch; max-width: 35ch; overflow: hidden; text-overflow: ellipsis; }
    th:nth-child(3), td:nth-child(3) { width: 220px; }
    th:nth-child(4), td:nth-child(4) { width: 200px; }
    th:nth-child(5), td:nth-child(5) { width: 130px; }
    th:nth-child(6), td:nth-child(6) { width: 140px; }
    th:nth-child(7), td:nth-child(7) { width: 90px; }
    .sort-button { display: inline-flex; align-items: center; gap: 8px; padding: 8px 0; border: 0; background: transparent; color: inherit; font: inherit; letter-spacing: inherit; cursor: pointer; }
    .sort-arrow { color: #8a93a3; font-size: 14px; line-height: 1; }
    .sort-arrow.active { color: #0646a5; }
    td { height: 76px; padding: 0 20px; color: #6b7180; font-size: 14px; border-bottom: 1px solid #e9ebf0; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    td:first-child { color: #243a5e; font-family: ui-monospace, Consolas, monospace; font-weight: 700; }
    td:nth-child(2) { color: #25344f; font-weight: 600; }
    .role { color: #087f83; font-weight: 600; }
    .status { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 20px; color: #27ad79; background: #eaf8f2; font-size: 12px; font-weight: 700; }
    .status svg { width: 13px; height: 13px; }
    .action { border: 0; background: transparent; color: #c90012; cursor: pointer; padding: 8px; }
    .action svg { width: 17px; height: 17px; }
    .empty { display: none; padding: 42px 16px; color: var(--muted); text-align: center; }
    .card-footer { min-height: 72px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid #e9ebf0; color: #5d6472; font-size: 14px; }
    .pagination { display: flex; align-items: center; gap: 8px; }
    .page-button { min-width: 38px; height: 38px; padding: 0 12px; border: 1px solid #cbd1df; border-radius: 12px; background: #fff; color: #52596a; cursor: pointer; }
    .page-button.current { color: #fff; border-color: #0646a5; background: #0646a5; }
    .page-button:disabled { color: #aeb3bd; cursor: default; }
    @media (max-width: 900px) {
      .sidebar { width: 220px; }
      .topbar { padding: 0 24px; }
      .content { padding: 24px 20px 36px; }
      .title-row, .staff-card { margin-left: 0; margin-right: 0; }
      .toolbar { padding: 12px 18px; }
    }
    @media (max-width: 650px) {
      body { display: block; }
      .sidebar { width: 100%; }
      .brand { height: 72px; }
      .nav-list { display: flex; overflow-x: auto; padding: 10px; }
      .nav-item { flex: 0 0 auto; }
      .nav-list .nav-item:not(.active) { display: none; }
      .topbar { min-height: 70px; padding: 0 16px; }
      .topbar-right { gap: 10px; }
      .topbar-right > span { display: none; }
      .content { padding: 18px 12px; }
      .back { margin-bottom: 12px; }
      .title-row { align-items: flex-start; flex-direction: column; margin-bottom: 18px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .search { width: 100%; }
      .card-footer { align-items: flex-start; flex-direction: column; }
    }
  
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 2000; opacity: 0; visibility: hidden; transition: all 0.2s ease; }
    .modal-backdrop.show { opacity: 1; visibility: visible; }
    .modal-card { background: #fff; border-radius: 16px; padding: 0; width: 100%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); transform: scale(0.95); transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    .modal-backdrop.show .modal-card { transform: scale(1); }

.toast-banner {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background-color: #082f72;
  color: #ffffff;
  padding: 14px 20px;
  border-radius: 12px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 99999;
  font-size: 13.5px;
  font-weight: 600;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
  max-width: 90%;
  min-width: 300px;
}

.toast-banner.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
  pointer-events: auto;
}

.toast-banner.success {
  background-color: #16a34a;
}

.toast-banner.error {
  background-color: #e11d48;
}

.toast-banner.info {
  background-color: #0c5ad2;
}

.toast-banner-icon {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}

.toast-banner-text {
  flex: 1;
  line-height: 1.45;
}

.toast-banner-close {
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.85);
  cursor: pointer;
  padding: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  transition: background-color 0.15s ease-in-out;
}

.toast-banner-close:hover {
  background-color: rgba(255, 255, 255, 0.2);
  color: #ffffff;
}
  </style>
</head>

      <a href="#" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.63l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.49-.42h-3.84a.5.5 0 0 0-.49.42L9.2 5.33c-.59.22-1.13.53-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.66 8.85a.5.5 0 0 0 .12.63l2.03 1.58a6.2 6.2 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.63l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96c.49.4 1.03.72 1.62.94l.36 2.54a.5.5 0 0 0 .49.42h3.84a.5.5 0 0 0 .49-.42l.36-2.54c.59-.22 1.13-.53 1.62-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.63zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>System Config</a>

      <a href="staffManagement.html" class="nav-item active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M20 8v6M17 11h6"></path></svg>Staff Management</a>
      <a href="#" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>Communication</a>

  <main class="main">
    <header class="admin-header" data-admin-header data-page-title="Staff Management"></header>
    <section class="content">
      <a class="back" href="adminDashboard.html" aria-label="Back to admin dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"></path><path d="M9 12h12"></path></svg></a>
      <div class="title-row">
        <div><h1>Staff Account Management</h1><p class="subtitle">Overview and management of active ReByte staff.</p></div>
        <button class="add-button" type="button" onclick="window.location.href='createStaffAccount.html'"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#fff"></circle><path d="M12 7v10M7 12h10" stroke="#0646a5" stroke-width="2.5"></path></svg>Add New Staff</button>
      </div>
      <section class="staff-card" aria-label="Staff accounts">
        <div class="toolbar">
          <div class="tabs" role="tablist" aria-label="Staff status">
            <button class="tab active" id="activeTab" type="button" role="tab" aria-selected="true">Active Staff</button>
            <button class="tab" id="archivedTab" type="button" role="tab" aria-selected="false">Archived</button>
          </div>
          <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="6.5"></circle><path d="m16 16 5 5"></path></svg><input id="staffSearch" type="search" placeholder="Search staff..." aria-label="Search staff"></label>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th data-sort-column="staffNo" aria-sort="ascending"><button class="sort-button" type="button" data-sort="staffNo">STAFF ID <span class="sort-arrow active" aria-hidden="true">↑</span></button></th><th data-sort-column="fullName" aria-sort="none"><button class="sort-button" type="button" data-sort="fullName">NAME <span class="sort-arrow" aria-hidden="true">↕</span></button></th><th>EMAIL</th><th>ROLE</th><th>STATUS</th><th>CREATED</th><th>ACTIONS</th></tr></thead>
            <tbody id="staffRows">
            </tbody>
          </table>
          <div class="empty" id="emptyState">No staff found.</div>
        </div>
        <footer class="card-footer"><span id="resultCount">Showing 0 entries</span><div class="pagination" id="staffPagination" aria-label="Staff pages"></div></footer>
      </section>
    </section>
  </main>
  <script src="../accountManagementModule/auth.js"></script>
  <script>
    const user = ReByteAuth.getUser();
    if (!user || user.role !== 'Admin') window.location.href = '../accountManagementModule/login.html';
    
    let allStaffData = [];
    const tbody = document.getElementById('staffRows');
    const search = document.getElementById('staffSearch');
    const pagination = document.getElementById('staffPagination');
    const sortButtons = document.querySelectorAll('.sort-button[data-sort]');
    const tabs = [document.getElementById('activeTab'), document.getElementById('archivedTab')];
    const PAGE_SIZE = 5;
    let status = 'active';
    let currentPage = 1;
    let sortKey = 'staffNo';
    let sortDirection = 'asc';

    async function loadStaff() {
        try {
            const res = await fetch('http://localhost:3000/staff-list', {
                headers: { Authorization: `Bearer ${user.token || ''}` }
            });
            const data = await res.json();
            if(!res.ok) throw new Error(data.error || 'Could not load staff records.');
            allStaffData = data;
            renderRows();
        } catch(e) {
            console.error('Could not load staff records:', e);
            if (typeof ReByteAuth !== 'undefined') ReByteAuth.showToast(e.message || 'Could not load staff records.', 'error');
        }
    }

    function formatDate(seconds) {
        if(!seconds) return 'N/A';
        const d = new Date(seconds * 1000);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function renderRows() {
      const query = search.value.trim().toLowerCase();
      const sortedStaff = [...allStaffData].sort((a, b) => {
        const valueA = String(a[sortKey] || '');
        const valueB = String(b[sortKey] || '');
        const comparison = valueA.localeCompare(valueB, undefined, { numeric: true, sensitivity: 'base' });
        return sortDirection === 'asc' ? comparison : -comparison;
      });
      const filteredStaff = sortedStaff.filter(staff => {
        const staffStatus = (staff.status || 'active').toLowerCase();
        const textContent = `${staff.staffNo || ''} ${staff.fullName || ''} ${staff.email || ''} ${staff.position || ''}`.toLowerCase();
        return staffStatus === status && textContent.includes(query);
      });

      const total = filteredStaff.length;
      const pageCount = Math.max(1, Math.ceil(total / PAGE_SIZE));
      currentPage = Math.min(currentPage, pageCount);
      const firstIndex = total ? (currentPage - 1) * PAGE_SIZE : 0;
      const pageRecords = filteredStaff.slice(firstIndex, firstIndex + PAGE_SIZE);
      tbody.innerHTML = '';

      pageRecords.forEach(staff => {
        const staffStatus = (staff.status || 'active').toLowerCase();
        const tr = document.createElement('tr');
        tr.dataset.status = staffStatus;
        const dateStr = staff.createdAt ? formatDate(staff.createdAt._seconds) : 'N/A';
        const roleStr = staff.position === 'Both' ? 'Inspector & Deliverer' : (staff.position || staff.role || 'Staff');
        tr.innerHTML = `
          <td>${staff.staffNo || '#STF-???'}</td>
          <td>${staff.fullName || 'Unknown'}</td>
          <td>${staff.email}</td>
          <td class="role">${roleStr}</td>
          <td><span class="status"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="8"></circle><path d="m4.2 8 2.3 2.3 5-5" fill="none" stroke="#fff" stroke-width="1.5"></path></svg>${staffStatus.charAt(0).toUpperCase() + staffStatus.slice(1)}</span></td>
          <td>${dateStr}</td>
          <td><button class="action" type="button" aria-label="Archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"></path></svg></button></td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('emptyState').style.display = total ? 'none' : 'block';
      document.getElementById('resultCount').textContent = total
        ? `Showing ${firstIndex + 1} to ${Math.min(firstIndex + PAGE_SIZE, total)} of ${total} entries`
        : 'Showing 0 entries';
      pagination.innerHTML = [
        `<button class="page-button" type="button" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>`,
        ...Array.from({ length: pageCount }, (_, index) => {
          const page = index + 1;
          return `<button class="page-button${page === currentPage ? ' current' : ''}" type="button" data-page="${page}"${page === currentPage ? ' aria-current="page"' : ''}>${page}</button>`;
        }),
        `<button class="page-button" type="button" data-page="${currentPage + 1}" ${currentPage === pageCount ? 'disabled' : ''}>Next</button>`
      ].join('');
    }

    search.addEventListener('input', () => { currentPage = 1; renderRows(); });
    pagination.addEventListener('click', event => {
      const button = event.target.closest('button[data-page]');
      if (!button || button.disabled) return;
      currentPage = Number(button.dataset.page);
      renderRows();
    });
    sortButtons.forEach(button => button.addEventListener('click', () => {
      if (sortKey === button.dataset.sort) {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        sortKey = button.dataset.sort;
        sortDirection = 'asc';
      }
      currentPage = 1;
      sortButtons.forEach(sortButton => {
        const active = sortButton.dataset.sort === sortKey;
        const column = sortButton.closest('th');
        const arrow = sortButton.querySelector('.sort-arrow');
        column.setAttribute('aria-sort', active ? (sortDirection === 'asc' ? 'ascending' : 'descending') : 'none');
        arrow.textContent = active ? (sortDirection === 'asc' ? '↑' : '↓') : '↕';
        arrow.classList.toggle('active', active);
      });
      renderRows();
    }));
    tabs.forEach((tab, index) => tab.addEventListener('click', () => {
      status = index ? 'archived' : 'active';
      currentPage = 1;
      tabs.forEach((item, itemIndex) => {
        item.classList.toggle('active', itemIndex === index);
        item.setAttribute('aria-selected', itemIndex === index ? 'true' : 'false');
      });
      renderRows();
    }));
    
    document.querySelectorAll('.nav-item[href="#"]').forEach(link => link.addEventListener('click', event => event.preventDefault()));

    // fetch on load
    loadStaff();
  </script>
  <script src="adminHeader.js"></script>
</body>
