    :root{--navy:#082f72;--blue:#0646a5;--page:#f5f7fb;--border:#e2e6ee;--text:#172033;--muted:#626b7d}*{box-sizing:border-box}body{display:flex;height:100vh;min-height:0;margin:0;overflow:hidden;background:var(--page);color:var(--text);font-family:Inter,Arial,sans-serif}.sidebar{width:260px;flex:0 0 260px;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--border)}.main{min-width:0;flex:1;display:flex;flex-direction:column}.main-content{min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain}.content{max-width:1160px;margin:0 auto;padding:30px 40px 56px}.back{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;margin:0 0 22px -8px;border-radius:8px;color:#596579;text-decoration:none}.back:hover{background:#e9edf4}.back svg{width:20px;height:20px}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.page-heading h1{margin:0 0 10px;color:#0f172a;font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-.5px}.page-heading p{margin:0;color:#596273;font-size:14.5px;line-height:1.5}.card{margin-bottom:18px;padding:22px;border:1px solid #e5e9f0;border-radius:16px;background:#fff;box-shadow:0 2px 8px #0f172a06}.field{margin-bottom:18px}.field:last-child{margin-bottom:0}.field label,.section-copy-label{display:block;margin:0 0 7px;color:#263654;font-size:13px;font-weight:700}.field input,.field textarea,.section-copy{width:100%;border:1px solid #d6ddea;border-radius:10px;outline:0;background:#fff;color:#182844;font:14px Inter,Arial,sans-serif}.field input{height:44px;padding:0 12px}.field textarea,.section-copy{min-height:84px;padding:11px 12px;resize:vertical;line-height:1.5}.field input:focus,.field textarea:focus,.section-copy:focus{border-color:#6b8ac6;box-shadow:0 0 0 3px #0646a51a}.field-error{margin:6px 0 0;color:#b42318;font-size:12px}.section-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.section-bar h2{margin:0 0 5px;color:#14284c;font-size:17px}.section-bar p{margin:0;color:#738097;font-size:12px}.button{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border:1px solid #ccd5e4;border-radius:10px;background:#fff;color:#263654;font:600 13px Inter,Arial,sans-serif;text-decoration:none;cursor:pointer}.button.primary{border-color:var(--navy);background:var(--navy);color:#fff}.button.primary:hover{background:#0b438f}.button.primary:disabled{border-color:#52698f;background:#52698f;color:#e8edf5;cursor:not-allowed}.button:disabled{opacity:.6;cursor:not-allowed}.section-list{display:grid;gap:12px}.section-card{padding:16px;border:1px solid #e1e6ef;border-radius:13px;background:#fbfcff}.section-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.section-top strong{color:#263654;font-size:13px}.remove-section{border:0;background:none;color:#b42318;font:600 12px Inter,Arial,sans-serif;cursor:pointer}.remove-section:disabled{color:#aeb6c3;cursor:not-allowed}.section-fields{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(240px,.8fr);gap:16px}.image-picker{min-height:84px;padding:12px;border:1px dashed #bbc7d9;border-radius:10px;background:#fff}.image-picker label{display:inline-flex;align-items:center;gap:8px;margin:0;padding:8px 11px;border:1px solid #cdd7e7;border-radius:8px;background:#fff;color:#25436e;font-size:12px;font-weight:600;cursor:pointer}.image-picker label svg{width:16px;height:16px}.image-picker input{display:none}.image-hint{display:block;margin-top:7px;color:#7a8496;font-size:11px}.image-previews{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.image-thumb{position:relative;width:54px;height:54px;border:1px solid #d8dfeb;border-radius:8px;overflow:hidden;background:#f1f4f8}.image-thumb img{width:100%;height:100%;object-fit:cover}.image-thumb button{position:absolute;top:2px;right:2px;width:18px;height:18px;display:grid;place-items:center;border:0;border-radius:50%;background:#fff;color:#a20e18;font-size:13px;line-height:1;cursor:pointer}.actions{display:flex;align-items:center;justify-content:flex-end;gap:10px}.form-status{margin-right:auto;color:#b42318;font-size:12px;line-height:1.4}.spinner{width:15px;height:15px;border:2px solid #ffffff77;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .is-invalid{border-color:#dc2626!important;background:#fffafa!important;box-shadow:0 0 0 3px #dc26261a!important}.section-error{min-height:16px;margin:6px 0 0;color:#b42318;font-size:12px;line-height:1.35}

  <style>.page-heading{align-items:flex-start}.heading-side{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:0}#deleteStandard[hidden]{display:none!important}.button.danger{border-color:#f0b7b7;background:#fff7f7;color:#b42318}.button.danger:hover{background:#feecec}.edit-confirm-backdrop{position:fixed;inset:0;z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;background:#0f172a99;backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .18s ease,visibility .18s ease}.edit-confirm-backdrop.show{opacity:1;visibility:visible}.edit-confirm-card{width:min(100%,420px);padding:28px 26px 22px;border-radius:18px;background:#fff;box-shadow:0 16px 48px #0f172a35;text-align:center}.edit-confirm-icon{width:54px;height:54px;display:grid;place-items:center;margin:0 auto 14px;border-radius:50%;background:#fee2e2;color:#d92d20}.edit-confirm-icon svg{width:27px;height:27px}.edit-confirm-card h2{margin:0 0 8px;color:#14284c;font-size:19px}.edit-confirm-card p{margin:0;color:#667085;font-size:14px;line-height:1.5}.edit-confirm-actions{display:flex;gap:10px;margin-top:22px}.edit-confirm-actions button{flex:1;min-height:42px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#475569;font:600 13px Inter,Arial,sans-serif;cursor:pointer}.edit-confirm-actions .danger{border-color:#dc2626;background:#dc2626;color:#fff}</style>

<body>
  <aside class="sidebar" data-admin-sidebar aria-label="Admin navigation"></aside><main class="main"><header class="admin-header" data-admin-header data-page-title="Configuration"></header><div class="main-content"><section class="content">
    <a class="back" href="inspectionStandards.html" aria-label="Back to inspection standards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"></path><path d="M9 12h12"></path></svg></a>
    <div class="page-heading"><div><h1 id="pageTitle">Create Inspection Standard</h1><p id="pageDescription">Add a title, short description, and up to 8 guidance sections.</p></div><div class="heading-side"><button class="button primary" id="createStandard" type="submit" form="standardForm" disabled>Create Standard</button><button class="button danger" id="deleteStandard" type="button" hidden>Remove Standard</button></div></div>
    <form id="standardForm" novalidate>
      <section class="card" aria-label="Standard details">
        <div class="field"><label for="standardTitle">Title <span aria-hidden="true">*</span></label><input id="standardTitle" maxlength="120" required placeholder="e.g. Display and touch inspection"><p class="field-error" id="titleError" hidden></p></div>
        <div class="field"><label for="standardDescription">Short description</label><textarea id="standardDescription" maxlength="300" placeholder="Briefly explain what this standard covers."></textarea></div>
      </section>
      <section class="card" aria-label="Inspection sections">
        <div class="section-bar"><div><h2>Sections <span aria-hidden="true">*</span></h2><p>Each section can include instructions and up to 5 JPG, PNG, or WebP images.</p></div><button class="button" id="addSection" type="button">＋ Add section <span id="sectionCountLabel">1/8</span></button></div>
        <div class="section-list" id="sectionList"></div>
      </section>
      <div class="actions"><span class="form-status" id="formStatus" aria-live="polite"></span></div>
    </form>
  </section></div></main>
  <div class="edit-confirm-backdrop" id="deleteConfirm" role="dialog" aria-modal="true" aria-labelledby="deleteConfirmTitle" aria-hidden="true"><div class="edit-confirm-card"><span class="edit-confirm-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"></path></svg></span><h2 id="deleteConfirmTitle">Remove inspection standard?</h2><p id="deleteConfirmText">This standard will be permanently removed.</p><div class="edit-confirm-actions"><button type="button" id="cancelDelete">Cancel</button><button type="button" class="danger" id="confirmDelete">Remove Standard</button></div></div></div>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="../accountManagementModule/auth.js"></script><script src="../reportModule/adminSidebar.js"></script><script src="../adminModule/adminHeader.js"></script>
  <script>
    (()=>{
      const user=ReByteAuth.getUser();if(!user||String(user.role||'').toLowerCase()!=='admin'){window.location.href='../accountManagementModule/login.html';return;}
      const API='http://localhost:3000/api/system-config/inspection-standards',MAX_SECTIONS=8,standardId=new URLSearchParams(window.location.search).get('id');
      const form=document.getElementById('standardForm'),titleInput=document.getElementById('standardTitle'),descInput=document.getElementById('standardDescription'),sectionList=document.getElementById('sectionList'),addButton=document.getElementById('addSection'),submitButton=document.getElementById('createStandard'),status=document.getElementById('formStatus');
      const deleteButton=document.getElementById('deleteStandard'),deleteConfirm=document.getElementById('deleteConfirm');
      let sections=[],saving=false,loading=true,baselineSnapshot=null;
      const esc=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      async function readJson(response){const type=response.headers.get('content-type')||'';if(!type.toLowerCase().includes('application/json')){const body=await response.text();if(body.trimStart().startsWith('<!DOCTYPE')||body.trimStart().startsWith('<html'))throw new Error(`The backend returned an HTML page (HTTP ${response.status}). Restart the backend on port 3000 to load the Inspection Standards API.`);throw new Error(`Unexpected backend response (HTTP ${response.status}).`);}return response.json();}
      const wait=milliseconds=>new Promise(resolve=>setTimeout(resolve,milliseconds));
      async function detailFetch(url) {
        for (let attempt = 0; attempt < 3; attempt++) {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 20000);
          try {
            const response = await fetch(url, { cache: 'no-store', signal: controller.signal });
            if (response.status < 500 || attempt === 2) return response;
          } catch (error) {
            if (attempt === 2) {
              if (error.name === 'AbortError') throw new Error('Loading the inspection standard timed out.');
              throw error;
            }
          } finally {
            clearTimeout(timeout);
          }
          await wait(700 * (attempt + 1));
        }
      }
      function currentSnapshot(){return JSON.stringify({title:titleInput.value.trim(),description:descInput.value.trim(),sections:sections.map(s=>({title:s.title.trim(),instructions:s.text.trim(),images:s.savedImages.slice(),files:s.files.map(f=>`${f.file.name}:${f.file.size}:${f.file.lastModified}`)}))});}
      function sync(){let hasComplete=false,hasPartial=false;sections.forEach(s=>{const started=!!(s.title.trim()||s.text.trim()||s.files.length||s.savedImages.length),complete=!!(s.title.trim()&&s.text.trim()),partial=started&&!complete;hasComplete||=complete;hasPartial||=partial;const article=sectionList.querySelector(`[data-section-id="${s.id}"]`);if(article){const titleField=article.querySelector('[data-section-title]'),instructionField=article.querySelector('[data-copy]'),titleError=article.querySelector('[data-title-error]'),instructionError=article.querySelector('[data-instruction-error]'),missingTitle=partial&&!s.title.trim(),missingInstruction=partial&&!s.text.trim();titleField.classList.toggle('is-invalid',missingTitle);instructionField.classList.toggle('is-invalid',missingInstruction);titleError.hidden=!missingTitle;instructionError.hidden=!missingInstruction;titleError.textContent=missingTitle?'Please enter a section title.':'';instructionError.textContent=missingInstruction?'Please enter the section instructions.':'';}});const changed=!standardId||!baselineSnapshot||currentSnapshot()!==baselineSnapshot;submitButton.disabled=loading||saving||!titleInput.value.trim()||!hasComplete||hasPartial||(!!standardId&&!changed);addButton.disabled=loading||sections.length>=MAX_SECTIONS;document.getElementById('sectionCountLabel').textContent=`${sections.length}/${MAX_SECTIONS}`;}
      function makeSection(data={}){return{id:`${Date.now()}-${Math.random().toString(36).slice(2,8)}`,title:String(data.title||''),text:String(data.instructions||''),files:[],savedImages:Array.isArray(data.images)?data.images.slice(0,5):[]};}
      function draw(){sectionList.innerHTML=sections.map((s,i)=>{const thumbs=[...s.savedImages.map((url,j)=>({preview:url,saved:true,index:j})),...s.files.map((f,j)=>({preview:f.preview,saved:false,index:j}))];return `<article class="section-card" data-section-id="${s.id}"><div class="section-top"><strong>Section ${i+1}</strong><button class="remove-section" type="button" data-remove-section="${s.id}" ${sections.length===1?'disabled':''}>Remove</button></div><div class="section-fields"><div><label class="section-copy-label" for="sectionTitle-${s.id}">Section title</label><input class="section-copy" style="min-height:44px" id="sectionTitle-${s.id}" data-section-title="${s.id}" maxlength="120" placeholder="e.g. Check screen condition" value="${esc(s.title)}"><p class="section-error" data-title-error hidden></p><label class="section-copy-label" style="margin-top:14px" for="copy-${s.id}">Instructions</label><textarea class="section-copy" id="copy-${s.id}" data-copy="${s.id}" maxlength="2000" placeholder="Write the inspection steps or criteria…">${esc(s.text)}</textarea><p class="section-error" data-instruction-error hidden></p></div><div class="image-picker"><label for="images-${s.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="m21 15-5-5L5 21"></path></svg>Add images</label><input id="images-${s.id}" data-images="${s.id}" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple><span class="image-hint">${thumbs.length}/5 images · max 15 MB each</span><div class="image-previews">${thumbs.map(t=>`<div class="image-thumb"><img src="${esc(t.preview)}" alt="Section ${i+1} image"><button type="button" data-remove-image="${s.id}" data-saved="${t.saved}" data-index="${t.index}" aria-label="Remove image">×</button></div>`).join('')}</div></div></div></article>`;}).join('');sync();}
      addButton.addEventListener('click',()=>{if(sections.length<MAX_SECTIONS){sections.push(makeSection());draw();}});
      titleInput.addEventListener('input',()=>{document.getElementById('titleError').hidden=true;sync();});descInput.addEventListener('input',sync);
      sectionList.addEventListener('input',e=>{if(e.target.dataset.sectionTitle){const s=sections.find(x=>x.id===e.target.dataset.sectionTitle);if(s)s.title=e.target.value;}if(e.target.dataset.copy){const s=sections.find(x=>x.id===e.target.dataset.copy);if(s)s.text=e.target.value;}sync();});
      sectionList.addEventListener('change',e=>{const id=e.target.dataset.images;if(!id||saving)return;const s=sections.find(x=>x.id===id);if(!s)return;let warning='';for(const file of Array.from(e.target.files||[])){if(s.files.length+s.savedImages.length>=5){warning='A section can contain up to 5 images.';break;}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){warning='Choose JPG, PNG, or WebP images.';continue;}if(file.size>15*1024*1024){warning='Each image must be 15 MB or smaller.';continue;}s.files.push({file,preview:URL.createObjectURL(file)});}status.textContent=warning;draw();});
      sectionList.addEventListener('click',e=>{if(saving)return;const remove=e.target.dataset.removeSection;if(remove&&sections.length>1){const s=sections.find(x=>x.id===remove);s?.files.forEach(discardImage);sections=sections.filter(x=>x.id!==remove);draw();return;}const id=e.target.dataset.removeImage;if(id){const s=sections.find(x=>x.id===id),index=Number(e.target.dataset.index);if(!s)return;if(e.target.dataset.saved==='true')s.savedImages.splice(index,1);else if(s.files[index]){discardImage(s.files[index]);s.files.splice(index,1);}draw();}});
      sectionList.addEventListener('error', event => {
        const image = event.target;
        if (image instanceof HTMLImageElement &&
            /\/inspection-standards\/[a-f0-9-]{36}\.(jpg|png|webp)$/.test(image.src)) {
          image.alt = 'Image not available yet. It may still be uploading.';
        }
      }, true);

      function discardImage(entry) {
        URL.revokeObjectURL(entry.preview);
      }

      async function stageImage(entry) {
        if (entry.imageUrl) return entry.imageUrl;
        const data = new FormData();
        data.append('image', entry.file);
        const response = await fetch(`${API}/images?defer=1`, { method: 'POST', body: data });
        const result = await readJson(response);
        if (!response.ok || !result.imageUrl) throw new Error(result.error || 'An image could not be queued.');
        entry.imageUrl = result.imageUrl;
        return entry.imageUrl;
      }

      async function buildPayloadSections(validSections) {
        const payload = validSections.map(section => ({
          title: section.title.trim(),
          instructions: section.text.trim(),
          images: section.savedImages.slice()
        }));
        const jobs = validSections.flatMap((section, index) => section.files.map(entry => ({ index, entry })));
        for (let offset = 0; offset < jobs.length; offset += 3) {
          const batch = jobs.slice(offset, offset + 3);
          status.textContent = 'Sending images to ReByte…';
          const results = await Promise.allSettled(batch.map(job => stageImage(job.entry)));
          const failure = results.find(result => result.status === 'rejected');
          if (failure) throw failure.reason;
          batch.forEach((job, index) => payload[job.index].images.push(results[index].value));
        }
        return payload;
      }
      let baselineSectionIds = [];
      let standardUpdatedAt = null;

      function buildStandardPatch(title, description, payloadSections) {
        const baseline = JSON.parse(baselineSnapshot);
        const patch = { expectedUpdatedAt: standardUpdatedAt };
        if (title !== baseline.title) patch.title = title;
        if (description !== baseline.description) patch.description = description;
        const sectionUpdates = payloadSections.flatMap((section, index) => {
          const before = baseline.sections[index];
          const changes = {};
          if (section.title !== before.title) changes.title = section.title;
          if (section.instructions !== before.instructions) changes.instructions = section.instructions;
          if (JSON.stringify(section.images) !== JSON.stringify(before.images)) changes.images = section.images;
          return Object.keys(changes).length ? [{ index, ...changes }] : [];
        });
        if (sectionUpdates.length) patch.sectionUpdates = sectionUpdates;
        return patch;
      }

      const adminIdentity = user.uid || user.userId || user.email;
      const detailCacheKey = standardId && adminIdentity
        ? `rebyte:inspection-standard:${encodeURIComponent(adminIdentity)}:${encodeURIComponent(standardId)}`
        : '';

      function readCachedDetail() {
        if (!detailCacheKey) return null;
        try {
          const standard = JSON.parse(sessionStorage.getItem(detailCacheKey));
          return standard?.id === standardId ? standard : null;
        } catch (_) { return null; }
      }

      function cacheDetail(standard) {
        if (!detailCacheKey) return;
        try {
          if (standard) sessionStorage.setItem(detailCacheKey, JSON.stringify(standard));
          else sessionStorage.removeItem(detailCacheKey);
        } catch (_) {}
      }

      function showStandard(standard) {
        titleInput.value = standard.title || '';
        descInput.value = standard.description || '';
        const savedSections = Array.isArray(standard.sections) ? standard.sections : [];
        sections = (savedSections.length ? savedSections : [{}]).slice(0, MAX_SECTIONS)
          .map((section, index) => makeSection({
            ...section, title: section.title || section.sectionTitle || section.name || `Section ${index + 1}`
          }));
        baselineSnapshot = currentSnapshot();
        baselineSectionIds = sections.map(section => section.id);
        draw();
      }

      async function loadForEdit() {
        if (!standardId) {
          loading = false;
          sections = [makeSection()];
          draw();
          return;
        }

        document.getElementById('pageTitle').textContent = 'Edit Inspection Standard';
        document.getElementById('pageDescription').textContent = 'Update the standard title, instructions, and reference images. Image removals take effect when you save.';
        deleteButton.hidden = false;
        deleteButton.disabled = true;
        submitButton.textContent = 'Save Changes';
        const cached = readCachedDetail();
        if (cached) showStandard(cached);
        else {
          sync();
          status.textContent = 'Loading inspection standard…';
        }

        try {
          const response = await detailFetch(`${API}/${encodeURIComponent(standardId)}`);
          if ([401, 403, 404].includes(response.status)) {
            cacheDetail(null);
            titleInput.value = descInput.value = '';
            sections = [];
            draw();
          }
          const result = await readJson(response);
          if (!response.ok || !result.standard) throw new Error(result.error || `Could not load standard (HTTP ${response.status}).`);

          cacheDetail(result.standard);
          const visibleDetail = standard => JSON.stringify([standard.title, standard.description, standard.sections]);
          const detailChanged = !cached || visibleDetail(cached) !== visibleDetail(result.standard);
          if (cached && detailChanged && currentSnapshot() !== baselineSnapshot) {
            status.textContent = 'This standard changed while you were editing. Reopen it before saving.';
            return;
          }
          standardUpdatedAt = result.standard.updatedAt ?? null;
          loading = false;
          deleteButton.disabled = false;
          if (detailChanged) showStandard(result.standard);
          else sync();
          status.textContent = '';
        } catch (error) {
          status.textContent = error.message || 'Could not load this inspection standard.';
        }
      }
      function openDeleteConfirm(){document.getElementById('deleteConfirmText').textContent=`“${titleInput.value.trim()||'This standard'}” and its inspection guidance will be permanently removed.`;deleteConfirm.classList.add('show');deleteConfirm.setAttribute('aria-hidden','false');}
      function closeDeleteConfirm(){deleteConfirm.classList.remove('show');deleteConfirm.setAttribute('aria-hidden','true');}
      deleteButton.addEventListener('click',openDeleteConfirm);document.getElementById('cancelDelete').addEventListener('click',closeDeleteConfirm);deleteConfirm.addEventListener('click',e=>{if(e.target===deleteConfirm)closeDeleteConfirm();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&deleteConfirm.classList.contains('show'))closeDeleteConfirm();});
      document.getElementById('confirmDelete').addEventListener('click',async e=>{if(!standardId||loading)return;const button=e.currentTarget;button.disabled=true;button.textContent='Removing…';try{const response=await fetch(`${API}/${encodeURIComponent(standardId)}`,{method:'DELETE'});const result=await readJson(response);if(!response.ok)throw new Error(result.error||'Could not remove the inspection standard.');cacheDetail(null);closeDeleteConfirm();window.location.href=`inspectionStandards.html?removed=1${result.imageCleanupFailures?.length?'&cleanupFailed=1':''}`;}catch(error){closeDeleteConfirm();if(typeof ReByteAuth.showToast==='function')ReByteAuth.showToast(error.message||'Could not remove the inspection standard.','error');}finally{button.disabled=false;button.textContent='Remove Standard';}});
      form.addEventListener('submit',async e=>{e.preventDefault();if(loading||saving)return;const title=titleInput.value.trim(),validSections=sections.filter(s=>s.title.trim()&&s.text.trim());if(!title){const error=document.getElementById('titleError');error.textContent='Please enter a title.';error.hidden=false;titleInput.focus();return;}if(sections.some(s=>(s.title.trim()||s.text.trim()||s.files.length||s.savedImages.length)&&!(s.title.trim()&&s.text.trim()))){status.textContent='Complete the title and instructions for every section with content.';sync();return;}if(!validSections.length){status.textContent='Add a section title and instructions to at least one section.';return;}const description=descInput.value.trim();const usePatch=standardId&&validSections.length===baselineSectionIds.length&&validSections.every((section,index)=>section.id===baselineSectionIds[index]);const hasNewImages=validSections.some(section=>section.files.length);saving=true;status.textContent='Saving standard…';submitButton.innerHTML='<span class="spinner" aria-hidden="true"></span> Saving';sync();try{const payloadSections=await buildPayloadSections(validSections);status.textContent='Saving standard…';const response=await fetch(standardId?`${API}/${encodeURIComponent(standardId)}`:API,{method:usePatch?'PATCH':standardId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(usePatch?buildStandardPatch(title,description,payloadSections):{title,description,sections:payloadSections})});const result=await readJson(response);if(!response.ok)throw new Error(result.error||`Could not save standard (HTTP ${response.status}).`);if(standardId)cacheDetail(result.standard);window.location.href=`inspectionStandards.html?saved=${standardId?'updated':'created'}${result.imageCleanupFailures?.length?'&cleanupFailed=1':''}${hasNewImages?'&imagesPending=1':''}`;}catch(error){status.textContent=error.message||'Could not save the inspection standard.';}finally{saving=false;submitButton.textContent=standardId?'Save Changes':'Create Standard';sync();}});
      loadForEdit();
    })();
  </script>
</body>
