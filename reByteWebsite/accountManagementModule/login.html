<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal - ReByte</title>
  <meta name="description" content="Sign in to the ReByte Staff Portal.">
  <link rel="stylesheet" href="styles.css">
  <style>
    .staff-login-page {
      min-height: 100dvh;
    }

    .staff-login-header {
      justify-content: center;
    }

    .staff-login-page .auth-page-container {
      flex: 1 0 auto;
      min-height: 0;
      padding: clamp(12px, 3vh, 32px) clamp(12px, 3vw, 24px);
    }

    .staff-login-page .auth-split-layout {
      min-height: min(560px, 74dvh);
    }

    .staff-login-page .auth-banner-side {
      padding: clamp(20px, 5vh, 44px) clamp(20px, 4vw, 48px);
    }

    .staff-login-page .auth-card-side {
      padding: clamp(24px, 8dvh, 68px) clamp(24px, 6vw, 68px);
    }

    .staff-login-page .auth-form-header {
      margin-bottom: clamp(24px, 6dvh, 44px);
    }

    .staff-login-page .form-group {
      margin-bottom: clamp(18px, 4.5dvh, 34px);
    }

    @media (max-height: 480px) {
      .staff-login-header {
        height: 56px;
      }

      .staff-login-page .auth-split-layout {
        max-width: 540px;
        grid-template-columns: 1fr;
        min-height: 0;
      }

      .staff-login-page .auth-banner-side {
        display: none;
      }

      .staff-login-page .auth-card-side {
        padding-block: 20px;
      }
    }
  </style>
</head>
<body class="staff-login-page">

  <!-- ReByte Header -->
  <header class="site-header">
    <div class="container header-container staff-login-header">
      <!-- Brand Logo -->
      <a href="home.html" class="brand-link">
        <img src="assets/images/rebyte_logo.png" alt="ReByte Logo" class="brand-logo-img">
        <span class="brand-name">ReByte</span>
      </a>
    </div>
  </header>

  <!-- Login Main Layout -->
  <main class="auth-page-container">
    <div class="auth-split-layout">

      <!-- Left Column: Branding & Pillars -->
      <div class="auth-banner-side">
        <img src="assets/images/ecotech_bg.jpg" alt="Eco Background" class="auth-banner-illustration">
        <div class="auth-banner-inner">
          <h1 class="auth-banner-heading">
            Join the Recommerce<br>Revolution.
          </h1>
          <p class="auth-banner-subheading">
            Trade in, upgrade, and extend the lifecycle of premium hardware with confidence.
          </p>

          <div class="auth-badge-list">
            <div class="auth-badge-item">
              <svg class="auth-badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
              Certified Tech
            </div>
            <div class="auth-badge-item">
              <svg class="auth-badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a10 10 0 0 0-10 10c0 5.52 4.48 10 10 10s10-4.48 10-10A10 10 0 0 0 12 2zm1 14.93V18h-2v-1.07A4.002 4.002 0 0 1 9.07 14H11c0 1.1.9 2 2 2s2-.9 2-2c0-.73-.4-1.37-1-1.73V11a2 2 0 0 0-2-2H9.07A4.002 4.002 0 0 1 11 6.07V5h2v1.07A4.002 4.002 0 0 1 14.93 9H13a2 2 0 0 0-2 2v.27c.6.36 1 1 1 1.73z"></path></svg>
              Sustainable
            </div>
            <div class="auth-badge-item">
              <svg class="auth-badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
              Secure Transactions
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Login Card -->
      <div class="auth-card-side">
        <div class="auth-form-header">
          <h2 class="auth-title">Staff Portal</h2>
          <p class="auth-subtitle">Sign in with your ReByte website account.</p>
        </div>

        <form id="loginForm" novalidate>
          <!-- Email Input -->
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address</label>
            <div class="input-with-icon-wrapper">
              <svg class="input-icon-prefix" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="input-error-msg" id="loginEmailError"></div>
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <div class="form-label-row">
              <label class="form-label" for="loginPassword">Password</label>
            </div>
            <div class="input-with-icon-wrapper">
              <svg class="input-icon-prefix" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              <input type="password" id="loginPassword" class="form-input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" required>
              <button type="button" class="input-toggle-password" id="toggleLoginPasswordBtn" aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
              </button>
            </div>
            <div class="input-error-msg" id="loginPasswordError"></div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-auth-submit" id="loginSubmitBtn">
            Sign In
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </form>
      </div>

    </div>
  </main>

  <!-- Firebase Compat Client SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="auth.js"></script>
  <script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('toggleLoginPasswordBtn');
    const pwdInput = document.getElementById('loginPassword');
    toggleBtn.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      toggleBtn.innerHTML = isPwd
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
    });

    // Form and input elements
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('loginEmail');
    const emailError = document.getElementById('loginEmailError');
    const pwdError = document.getElementById('loginPasswordError');
    const submitBtn = document.getElementById('loginSubmitBtn');

    let hasInteractedWithEmail = false;

    // Instant format validation matching mobile _validateEmail
    function validateEmailInput(showError = true) {
      const val = emailInput.value;
      const res = ReByteAuth.validateEmail(val);

      if (!res.isValid) {
        if (showError) {
          emailError.textContent = res.message;
          emailError.classList.add('show');
          emailInput.classList.add('input-error');
        }
        return false;
      } else {
        emailError.textContent = '';
        emailError.classList.remove('show');
        emailInput.classList.remove('input-error');
        return true;
      }
    }

    function validatePasswordInput(showError = true) {
      const pwd = pwdInput.value;
      if (!pwd || pwd.length === 0) {
        if (showError) {
          pwdError.textContent = 'Password cannot be empty';
          pwdError.classList.add('show');
          pwdInput.classList.add('input-error');
        }
        return false;
      } else {
        pwdError.textContent = '';
        pwdError.classList.remove('show');
        pwdInput.classList.remove('input-error');
        return true;
      }
    }

    // Check if form is valid matching mobile _isFormValid
    function updateFormValidity() {
      const isEmailValid = ReByteAuth.validateEmail(emailInput.value).isValid;
      const isPwdValid = pwdInput.value.length > 0;
      const isFormValid = isEmailValid && isPwdValid;

      submitBtn.disabled = !isFormValid;
      return isFormValid;
    }

    // Instant listeners matching mobile onChanged
    emailInput.addEventListener('input', () => {
      hasInteractedWithEmail = true;
      validateEmailInput(true);
      pwdError.textContent = '';
      pwdError.classList.remove('show');
      pwdInput.classList.remove('input-error');
      updateFormValidity();
    });

    emailInput.addEventListener('blur', () => {
      if (hasInteractedWithEmail || emailInput.value.length > 0) {
        validateEmailInput(true);
      }
      updateFormValidity();
    });

    pwdInput.addEventListener('input', () => {
      pwdError.textContent = '';
      pwdError.classList.remove('show');
      pwdInput.classList.remove('input-error');
      updateFormValidity();
    });

    pwdInput.addEventListener('blur', () => {
      if (pwdInput.value.length > 0) {
        validatePasswordInput(true);
      }
      updateFormValidity();
    });

    // Form submission matching mobile _handleLogin
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const isEmailValid = validateEmailInput(true);
      const isPwdValid = validatePasswordInput(true);

      if (!isEmailValid) {
        emailInput.focus();
        return;
      }
      if (!isPwdValid) {
        pwdInput.focus();
        return;
      }

      // Set loading state matching mobile _isLoading
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="btn-spinner"></span> <span>Signing In...</span>`;

      const result = await ReByteAuth.login(emailInput.value, pwdInput.value);

      // Re-enable button
      submitBtn.disabled = false;
      submitBtn.innerHTML = `<span>Sign In</span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
      updateFormValidity();

      if (result.success) {
        ReByteAuth.showToast(result.message || 'Signed in successfully!', 'success');
        setTimeout(() => {
          if (ReByteAuth.canOpenAdminDashboard(result.role)) {
            window.location.href = '../adminModule/adminDashboard.html';
          } else {
            window.location.href = 'home.html';
          }
        }, 700);
      } else {
        const errorMsg = result.error || 'Login failed';

        const isSocialAccount = /registered at (Google|Facebook)/i.test(errorMsg);
        const message = errorMsg.toLowerCase();
        if (isSocialAccount || message.includes('register an account first') || (message.includes('email') && !message.includes('password'))) {
          emailError.textContent = isSocialAccount ? 'Use your ReByte website account email and password.' : errorMsg;
          emailError.classList.add('show');
          emailInput.classList.add('input-error');
          emailInput.focus();
        } else {
          // "Incorrect email or password" or other credential issues
          pwdError.textContent = errorMsg;
          pwdError.classList.add('show');
          pwdInput.classList.add('input-error');
          emailInput.classList.add('input-error');
          pwdInput.focus();
        }
      }
    });

    // Initial check on load
    updateFormValidity();
  </script>
</body>
</html>
